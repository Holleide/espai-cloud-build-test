# 由 EspAiStudio 生成的 PlatformIO 云端编译工作流
# 触发：App 经 POST /actions/workflows/<本文件名>/dispatches 手动触发（文件名以 App 设置页『工作流文件名』为准）
name: EspAiStudio PlatformIO Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'PlatformIO board (informational; actual board is read from platformio.ini)'
        required: false
        default: 'esp32-s3-devkitc-1  // 尽管目标是STM32F103，但在PIO框架下我们仍使用对标的平台配置进行构建。实际硬件引脚需根据具体板卡定义调整。'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Build firmware (pio run)
        run: pio run

      - name: Collect flashable firmware images
        run: |
          mkdir -p _fwout
          find .pio/build -maxdepth 2 \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \) -exec cp -v {} _fwout/ \; || true
          ls -la _fwout

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            _fwout/*.bin
            _fwout/*.hex
            _fwout/*.uf2
          if-no-files-found: error
