# 由 EspAiStudio 生成的 PlatformIO 云端编译工作流
# 触发：App 通过 POST /actions/workflows/build-firmware.yml/dispatches 手动触发
name: EspAiStudio PlatformIO Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'PlatformIO board (informational; actual board is read from platformio.ini)'
        required: false
        default: 'esp32dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Build firmware (pio run)
        run: pio run

      - name: Collect flashable binaries
        run: |
          mkdir -p _fwout
          find .pio/build -maxdepth 2 -name '*.bin' -exec cp -v {} _fwout/ \; || true
          ls -la _fwout

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: _fwout/*.bin
          if-no-files-found: error
