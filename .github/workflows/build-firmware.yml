# 由 EspAiStudio 生成的 ESP-IDF 云端编译工作流
# 触发：App 经 POST /actions/workflows/<本文件名>/dispatches 手动触发（文件名以 App 设置页『工作流文件名』为准）
name: EspAiStudio Firmware Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ESP-IDF target chip'
        required: false
        default: 'esp32'
      idf_version:
        description: 'ESP-IDF docker-image tag (e.g. v6.0.1, or v5.3, or master)'
        required: false
        default: 'v6.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware (esp-idf-ci-action)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ inputs.idf_version }}
          target: ${{ inputs.target }}
          path: '.'
          command: 'idf.py build'

      - name: Collect flashable binaries
        run: |
          mkdir -p _fwout
          find build -maxdepth 2 -name '*.bin' -exec cp -v {} _fwout/ \; || true
          ls -la _fwout

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: _fwout/*.bin
          if-no-files-found: error
