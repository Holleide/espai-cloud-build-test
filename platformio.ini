; ESP32-C3 BLE HID 固件工程（由 EspAiStudio 云端编译：ubuntu + pio run）
; 板卡 esp32-c3-devkitm-1 / 框架 arduino。BLE Mouse 依赖走 GitHub 源，避免依赖注册表命名。
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/T-vK/ESP32-BLE-Mouse.git
